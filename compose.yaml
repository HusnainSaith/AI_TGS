services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tgs
      POSTGRES_USER: tgs
      POSTGRES_PASSWORD: tgs_dev_only
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tgs -d tgs']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
